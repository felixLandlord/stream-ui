[project]
name = "fastapi-stream-ui"
version = "0.1.4"
description = "Interactive streaming API explorer for FastAPI — SSE, WebSocket, and beyond"
readme = "PYPI_README.md"
requires-python = ">=3.10"
authors = [
    { name = "felixLandlord", email = "felix.landlord.nunoo@gmail.com" }
]
keywords = ["fastapi", "sse", "websocket", "streaming", "devtools", "api"]
dependencies = [
    "fastapi>=0.136.1",
    "starlette>=1.0.0",
]
 
[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.46.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "anyio>=4.13.0",
]

[project.urls]
Homepage = "https://github.com/felixLandlord/stream-ui"
Documentation = "https://github.com/felixLandlord/stream-ui#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["stream_ui*"]
 
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]